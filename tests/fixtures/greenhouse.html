<!doctype html><html><body>
<form id="application_form">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email</label><input id="email" name="email" type="email">
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="linkedin">LinkedIn URL</label><input id="linkedin" name="linkedin">
  <label for="languages">Languages spoken</label><textarea id="languages" name="languages"></textarea>
  <fieldset><legend>Education</legend>
    <label for="school">University</label><input id="school" name="education_school">
    <label for="degree">Degree</label><input id="degree" name="education_degree">
    <label for="grad">Expected graduation date</label><input id="grad" name="education_end_date" type="month">
  </fieldset>
  <label for="skills">Skills</label><textarea id="skills" name="skills"></textarea>
  <label for="eu-citizen">EU citizen</label>
  <select id="eu-citizen" name="eu_citizen"><option value="">Select one</option><option value="yes">Yes</option><option value="no">No</option></select>
  <label for="motivation">Why this role?</label><textarea id="motivation"></textarea>
  <button type="submit">Submit</button>
</form>
</body></html>
