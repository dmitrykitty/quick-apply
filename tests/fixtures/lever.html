<!doctype html><html><body>
<form class="application-form">
  <label>Full Name <input name="name" autocomplete="name"></label>
  <label>Email address <input name="email" type="email"></label>
  <label>Phone number <input name="phone" type="tel"></label>
  <label>Portfolio URL <input name="urls[Portfolio]" type="url"></label>
  <label>Language <input name="language" type="text"></label>
  <section><h2>Work experience</h2>
    <label>Current company <input name="experience_company"></label>
    <label>Job title <input name="experience_title"></label>
    <label>Work location <input name="experience_location"></label>
    <label>Start date <input name="experience_start_date" type="month"></label>
  </section>
  <label>How did you hear about us? <textarea name="source"></textarea></label>
  <fieldset><legend>Are you willing to relocate?</legend>
    <label><input type="radio" name="relocate" value="yes">Yes</label>
    <label><input type="radio" name="relocate" value="no">No</label>
  </fieldset>
  <button type="submit">Submit</button>
</form>
</body></html>
