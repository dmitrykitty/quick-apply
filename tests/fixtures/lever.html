<!doctype html><html><body>
<form class="application-form">
  <label>Full Name <input name="name" autocomplete="name"></label>
  <label>Email address <input name="email" type="email"></label>
  <label>Phone number <input name="phone" type="tel"></label>
  <label>Portfolio URL <input name="urls[Portfolio]" type="url"></label>
  <fieldset><legend>Are you willing to relocate?</legend>
    <label><input type="radio" name="relocate" value="yes">Yes</label>
    <label><input type="radio" name="relocate" value="no">No</label>
  </fieldset>
  <button type="submit">Submit</button>
</form>
</body></html>
