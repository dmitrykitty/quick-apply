<!doctype html><html><body>
<main data-automation-id="applyFlowPage">
  <div data-automation-id="formField">
    <label data-automation-id="formFieldLabel" for="wd-first">First Name</label>
    <input id="wd-first" type="text">
  </div>
  <div data-automation-id="formField">
    <label data-automation-id="formFieldLabel" for="wd-city">City</label>
    <input id="wd-city" type="text">
  </div>
  <div data-automation-id="formField">
    <label data-automation-id="formFieldLabel" for="wd-country">Country</label>
    <button id="wd-country" role="combobox" aria-controls="countries" aria-expanded="false">Select one</button>
    <div id="countries" role="listbox" hidden><div role="option">Poland</div><div role="option">Germany</div></div>
  </div>
  <section data-automation-id="educationSection"><h2>Education</h2>
    <div data-automation-id="educationEntry">
    <div data-automation-id="formField">
      <label data-automation-id="formFieldLabel" for="wd-school">University</label>
      <input id="wd-school" role="combobox" aria-autocomplete="list" aria-controls="schools" autocomplete="off">
      <div id="schools" role="listbox" hidden></div>
    </div>
    <div data-automation-id="formField">
      <label data-automation-id="formFieldLabel" for="wd-graduation">Expected graduation date</label>
      <input id="wd-graduation" type="month">
    </div>
    </div>
    <div data-automation-id="educationEntry">
      <div data-automation-id="formField">
        <label data-automation-id="formFieldLabel" for="wd-school-2">University</label>
        <input id="wd-school-2" type="text">
      </div>
    </div>
  </section>
</main>
</body></html>
